
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | Supermercado San Rafael</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #f3f6f3;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.container {
  width: 100%;
  max-width: 460px;
  background: white;
  padding: 38px;
  border-radius: 18px;
  box-shadow: 0 8px 35px rgba(0,0,0,.08);
}

.logo {
  text-align: center;
  margin-bottom: 28px;
}

.logo h1 {
  color: #16803c;
  font-size: 25px;
}

.logo p {
  color: #777;
  font-size: 13px;
  margin-top: 7px;
}

h2 {
  color: #222;
  font-size: 24px;
  margin-bottom: 8px;
}

.subtitle {
  color: #777;
  font-size: 14px;
  margin-bottom: 25px;
}

.form-group {
  margin-bottom: 17px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: #333;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 9px;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: #16803c;
  box-shadow: 0 0 0 3px rgba(22,128,60,.08);
}

.terms {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 12px;
  color: #666;
  margin: 20px 0;
}

.terms input {
  width: auto;
  margin-top: 2px;
}

.terms a {
  color: #16803c;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 9px;
  background: #16803c;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #11652f;
}

.login {
  text-align: center;
  font-size: 13px;
  color: #777;
  margin-top: 22px;
}

.login a {
  color: #16803c;
  text-decoration: none;
  font-weight: bold;
}

.back {
  display: block;
  text-align: center;
  color: #777;
  font-size: 13px;
  text-decoration: none;
  margin-top: 22px;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
}

@media(max-width:480px) {
  .container {
    padding: 27px 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>SUPER SAN RAFAEL</h1>
    <p>Tu supermercado de confianza</p>
  </div>

  <h2>Crear una cuenta</h2>
  <p class="subtitle">
    Regístrate para disfrutar de una mejor experiencia.
  </p>

  <form id="registerForm">

    <div class="form-group">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre"
        placeholder="Ingresa tu nombre" required>
    </div>

    <div class="form-group">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo"
        placeholder="ejemplo@correo.com" required>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono"
        placeholder="+56 9 1234 5678" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password"
        placeholder="Mínimo 8 caracteres"
        minlength="8" required>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar contraseña</label>
      <input type="password" id="confirmPassword"
        placeholder="Repite tu contraseña" required>
    </div>

    <div class="terms">
      <input type="checkbox" id="aceptar" required>
      <label for="aceptar">
        Acepto los términos y condiciones y la política de privacidad.
      </label>
    </div>

    <button type="submit">Crear mi cuenta</button>

    <div class="message" id="message"></div>

  </form>

  <div class="login">
    ¿Ya tienes una cuenta?
    <a href="iniciar-sesion.html">Iniciar sesión</a>
  </div>

  <a href="index.html" class="back">
    ← Volver al supermercado
  </a>

</div>

<script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  message.style.display = "block";

  if (password !== confirmPassword) {
    message.style.background = "#fdeaea";
    message.style.color = "#c62828";
    message.textContent = "Las contraseñas no coinciden.";
    return;
  }

  message.style.background = "#fff4df";
  message.style.color = "#805500";
  message.textContent =
    "El formulario está listo. Para crear cuentas reales debemos conectar un sistema de autenticación seguro.";
});
</script>

</body>
</html>
