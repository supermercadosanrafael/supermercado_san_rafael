
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Supermercado San Rafael</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .login-container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .logo h1 {
      color: #C62828;
      font-size: 23px;
    }

    .logo p {
      color: #777;
      font-size: 14px;
      margin-top: 7px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #444;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #C62828;
      box-shadow: 0 0 0 3px rgba(198,40,40,.08);
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -5px;
      margin-bottom: 20px;
      color: #C62828;
      font-size: 13px;
      text-decoration: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #C62828;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #A51F1F;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #666;
      line-height: 2;
    }

    .links a {
      color: #C62828;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <img src="imagenes/logo.jpeg" alt="Logo Supermercado San Rafael">
      <h1>Supermercado San Rafael</h1>
      <p>Bienvenido de vuelta</p>
    </div>

    <h2>Iniciar sesión</h2>

    <div id="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          placeholder="ejemplo@correo.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        >
      </div>

      <a href="#" class="forgot" id="forgotPassword">
        ¿Olvidaste tu contraseña?
      </a>

      <button type="submit" id="loginButton">
        Iniciar sesión
      </button>

    </form>

    <div class="links">
      ¿Todavía no tienes cuenta?
      <a href="cuenta.html">Crear cuenta</a>
      <br>
      <a href="index.html">Volver al inicio</a>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    auth.languageCode = "es";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    function showMessage(text, success = false) {
      message.style.display = "block";
      message.style.background = success ? "#e8f5e9" : "#fdeaea";
      message.style.color = success ? "#16803c" : "#c62828";
      message.textContent = text;
    }

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Verificando...";

      try {
        const credential = await auth.signInWithEmailAndPassword(
          correo,
          password
        );

        await credential.user.reload();

        const user = auth.currentUser;

        if (!user.emailVerified) {
          await auth.signOut();

          showMessage(
            "Tu correo todavía no está verificado. Revisa tu bandeja de entrada y abre el enlace de Firebase."
          );
          return;
        }
        const destino = new URLSearchParams(window.location.search)
  .get("redirect");

if (destino === "carrito.html") {
  window.location.href = "carrito.html";
} else {
  window.location.href = "index.html";
}
return;

        showMessage("¡Bienvenido! Ingresando al supermercado...", true);

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);

      } catch (error) {
        console.error("Error de inicio de sesión:", error);

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/user-not-found" ||
          error.code === "auth/wrong-password"
        ) {
          showMessage("Correo o contraseña incorrectos.");
        } else if (error.code === "auth/invalid-email") {
          showMessage("Ingresa un correo válido.");
        } else {
          showMessage("No se pudo iniciar sesión. Inténtalo nuevamente.");
        }

      } finally {
        button.disabled = false;
        button.textContent = "Iniciar sesión";
      }
    });

    // Recuperación de contraseña
    document.getElementById("forgotPassword").addEventListener("click", async function(e) {
      e.preventDefault();

      const correo = document.getElementById("correo").value.trim();

      if (!correo) {
        showMessage("Primero escribe tu correo electrónico.");
        return;
      }

      try {
        await auth.sendPasswordResetEmail(correo);

        showMessage(
          "Si el correo está registrado, recibirás instrucciones para restablecer tu contraseña.",
          true
        );

      } catch (error) {
        console.error(error);
        showMessage("No se pudo enviar el correo. Comprueba la dirección.");
      }
    });
  </script>

</body>
</html>
